name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping() on Supabase
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST \
            "https://pquvwrzfpkqfutvxffba.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_0xuBhcigKQLZhzdRz81a4Q_KF6ZPHnr" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; cat /tmp/out.txt
          [ "$code" = "200" ]
